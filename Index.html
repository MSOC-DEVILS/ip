<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poster Studio — Instant Product Poster Generator</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f8fafc;
    --accent:#e11d48;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%, #1e293b 0%, #0b1220 55%, #070b14 100%);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    padding:26px 28px 10px;
    color:#e2e8f0;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,#e11d48,#f97316);
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 10px 24px rgba(225,29,72,.35);
  }
  .topbar h1{font-size:19px;margin:0;letter-spacing:.2px}
  .topbar p{margin:2px 0 0;font-size:13px;color:#94a3b8}

  .grid{
    display:grid;
    grid-template-columns: 380px minmax(0,1fr);
    gap:22px;
    padding:16px 28px 40px;
    max-width:1400px;
    margin:0 auto;
    align-items:start;
  }
  @media (max-width: 980px){
    .grid{grid-template-columns:1fr;padding:14px}
  }

  .card{
    background:#fff;
    border-radius:20px;
    box-shadow:0 24px 60px rgba(2,6,23,.35);
    overflow:hidden;
  }

  /* ---------- FORM ---------- */
  .form{padding:20px 20px 24px;max-height:calc(100vh - 120px);overflow:auto}
  @media (max-width:980px){.form{max-height:none}}
  .form::-webkit-scrollbar{width:8px}
  .form::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}

  .sec-title{
    font-size:11px;font-weight:800;letter-spacing:.12em;
    color:#94a3b8;text-transform:uppercase;
    margin:18px 0 10px;
  }
  .sec-title:first-child{margin-top:0}

  label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 6px}
  .field{margin-bottom:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  input[type=text],input[type=number],select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);
    border-radius:11px;font-size:14px;font-family:inherit;color:var(--ink);
    background:#fff;outline:none;transition:.15s;
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,72,.12)}

  .file{
    display:flex;align-items:center;gap:10px;
    border:1.5px dashed #cbd5e1;border-radius:12px;padding:10px 12px;
    cursor:pointer;transition:.15s;background:#fbfcfe;
  }
  .file:hover{border-color:var(--accent);background:#fff5f7}
  .file input{display:none}
  .file .ico{font-size:18px}
  .file .txt{font-size:12.5px;font-weight:600;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file.has{border-style:solid;border-color:#22c55e;background:#f0fdf4}
  .file.has .txt{color:#15803d}

  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{
    width:30px;height:30px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 0 1.5px var(--line);cursor:pointer;transition:.15s;
  }
  .sw:hover{transform:scale(1.12)}
  .sw.active{box-shadow:0 0 0 2.5px var(--ink)}
  input[type=color]{
    width:38px;height:32px;border:1.5px solid var(--line);border-radius:9px;
    padding:2px;background:#fff;cursor:pointer;
  }

  .btn{
    width:100%;padding:13px;border:0;border-radius:12px;font-size:14px;
    font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,#e11d48,#f43f5e);color:#fff;
    box-shadow:0 10px 22px rgba(225,29,72,.32)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(225,29,72,.4)}
  .btn-ghost{background:#f1f5f9;color:#475569;margin-top:8px}
  .btn-ghost:hover{background:#e2e8f0}

  /* ---------- STAGE ---------- */
  .stage{padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .canvas-wrap{
    width:100%;display:grid;place-items:center;
    background:
      linear-gradient(45deg,#eef2f7 25%,transparent 25%) 0 0/22px 22px,
      linear-gradient(-45deg,#eef2f7 25%,transparent 25%) 0 11px/22px 22px,
      linear-gradient(45deg,transparent 75%,#eef2f7 75%) 11px -11px/22px 22px,
      linear-gradient(-45deg,transparent 75%,#eef2f7 75%) -11px 0/22px 22px,
      #f8fafc;
    border-radius:16px;padding:20px;
  }
  canvas{
    max-width:100%;max-height:74vh;height:auto;display:block;
    border-radius:10px;box-shadow:0 18px 50px rgba(2,6,23,.28);
  }
  .stage-actions{width:100%;display:flex;gap:10px}
  .stage-actions .btn{flex:1}
  .hint{font-size:12px;color:#94a3b8;text-align:center;margin:0}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🏷️</div>
  <div>
    <h1>Poster Studio</h1>
    <p>Fill the details → get a ready-to-share product poster.</p>
  </div>
</div>

<div class="grid">

  <!-- ================= FORM ================= -->
  <section class="card form">

    <div class="sec-title">Product Details</div>

    <div class="field">
      <label for="f_name">Product name</label>
      <input id="f_name" type="text" placeholder="e.g. Cotton Slim Fit T-Shirt" />
    </div>

    <div class="row">
      <div class="field">
        <label for="f_mrp">MRP</label>
        <input id="f_mrp" type="number" min="0" step="0.01" placeholder="999" />
      </div>
      <div class="field">
        <label for="f_price">Selling price</label>
        <input id="f_price" type="number" min="0" step="0.01" placeholder="649" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="f_discount">Discount % <span style="color:#94a3b8;font-weight:600">(auto)</span></label>
        <input id="f_discount" type="number" min="0" max="99" step="1" placeholder="35" />
      </div>
      <div class="field">
        <label for="f_currency">Currency symbol</label>
        <input id="f_currency" type="text" maxlength="3" value="₹" />
      </div>
    </div>

    <div class="sec-title">Branding & Contact</div>

    <div class="field">
      <label for="f_brand">TOP HEADING</label>
      <input id="f_brand" type="text" placeholder="HEADING" />
    </div>

    <div class="row">
      <div class="field">
        <label for="f_phone">SCAN QR CODE</label>
        <input id="f_phone" type="text" placeholder="SCAN QR CODE" />
      </div>
      <div class="field">
        <label for="f_website">OTY</label>
        <input id="f_website" type="text" placeholder="PACK OF 2" />
      </div>
    </div>

    <div class="sec-title">Images</div>

    <div class="field">
      <label class="file" id="lbl_photo">
        <input id="f_photo" type="file" accept="image/*" />
        <span class="ico">🖼️</span>
        <span class="txt" id="txt_photo">Upload product photo 1</span>
      </label>
    </div>

    <div class="field">
      <label class="file" id="lbl_photo2">
        <input id="f_photo2" type="file" accept="image/*" />
        <span class="ico">🖼️</span>
        <span class="txt" id="txt_photo2">Upload product photo 2 (optional)</span>
      </label>
    </div>

    <div class="field">
      <label class="file" id="lbl_qr">
        <input id="f_qr" type="file" accept="image/*" />
        <span class="ico">🔳</span>
        <span class="txt" id="txt_qr">Upload QR code (optional)</span>
      </label>
    </div>

    <div class="sec-title">Design</div>

    <div class="field">
      <label for="f_size">Poster size</label>
      <select id="f_size">
        <option value="portrait" selected>Instagram Portrait — 1080 × 1350 (4:5)</option>
      </select>
    </div>

    <div class="field">
      <label>Accent colour</label>
      <div class="swatches" id="swatches">
        <div class="sw active" data-color="#e11d48" style="background:#e11d48"></div>
        <div class="sw" data-color="#2563eb" style="background:#2563eb"></div>
        <div class="sw" data-color="#16a34a" style="background:#16a34a"></div>
        <div class="sw" data-color="#f59e0b" style="background:#f59e0b"></div>
        <div class="sw" data-color="#7c3aed" style="background:#7c3aed"></div>
        <div class="sw" data-color="#0f172a" style="background:#0f172a"></div>
        <div class="sw" data-color="#db2777" style="background:#db2777"></div>
        <input type="color" id="f_theme" value="#e11d48" title="Custom colour" />
      </div>
    </div>

  </section>

  <!-- ================= PREVIEW ================= -->
  <section class="card stage">
    <div class="canvas-wrap">
      <canvas id="poster"></canvas>
    </div>
    <div class="stage-actions">
      <button class="btn btn-primary" id="btn_download">⬇ Download PNG</button>
      <button class="btn btn-ghost" id="btn_reset" style="flex:0 0 130px">Reset</button>
    </div>
    <p class="hint">Tip: use a photo with a clean / white background for the best result.</p>
  </section>

</div>

<script>
/* =========================================================
   Poster Studio — canvas renderer
   ========================================================= */

const FONT = "'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif";

const canvas = document.getElementById('poster');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// Only Instagram Portrait size is available
const SIZES = {
  portrait: { w: 1080, h: 1350 }
};

const state = {
  brand: '', name: '', mrp: '', price: '', discount: '',
  currency: '₹', phone: '', website: '',
  size: 'portrait', theme: '#e11d48',
  productImg: null, productImg2: null, qrImg: null,
  manualDiscount: false
};

/* ---------------- helpers ---------------- */

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function mixWhite(hex, amt) {
  let c = String(hex).replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const r = parseInt(c.slice(0, 2), 16);
  const g = parseInt(c.slice(2, 4), 16);
  const b = parseInt(c.slice(4, 6), 16);
  const m = v => Math.round(v + (255 - v) * amt);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

function fmt(v) {
  const n = parseFloat(String(v).replace(/[^0-9.]/g, ''));
  if (!isFinite(n)) return '';
  return n.toLocaleString('en-IN');
}

function fitFont(text, maxWidth, baseSize, weight) {
  let size = baseSize;
  do {
    ctx.font = `${weight} ${size}px ${FONT}`;
    if (ctx.measureText(text).width <= maxWidth) return size;
    size -= 1;
  } while (size > 8);
  return 8;
}

function wrapText(text, maxWidth, maxLines) {
  const words = String(text).split(/\s+/).filter(Boolean);
  if (!words.length) return [''];
  const lines = [];
  let line = '';

  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width <= maxWidth) {
      line = test;
    } else {
      if (line) lines.push(line);
      line = word;
      if (lines.length === maxLines) break;
    }
  }
  if (lines.length < maxLines && line) lines.push(line);
  if (lines.length > maxLines) lines.length = maxLines;

  const consumed = lines.join(' ').split(/\s+/).filter(Boolean).length;
  if (consumed < words.length) {
    let last = lines[maxLines - 1];
    while (last.length > 1 && ctx.measureText(last + '…').width > maxWidth) {
      last = last.slice(0, -1);
    }
    lines[maxLines - 1] = last.trim() + '…';
  }
  return lines;
}

function drawContain(img, x, y, w, h, pad) {
  const aw = w - pad * 2;
  const ah = h - pad * 2;
  const s = Math.min(aw / img.width, ah / img.height);
  const dw = img.width * s;
  const dh = img.height * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

/* ---------------- main render ---------------- */

function render() {
  const S = SIZES[state.size];
  const w = S.w, h = S.h;
  canvas.width = w;
  canvas.height = h;

  const theme = state.theme || '#e11d48';

  /* ---- background ---- */
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(1, mixWhite(theme, 0.90));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.fillStyle = theme;
  ctx.beginPath(); ctx.arc(w * 0.97, h * 0.02, w * 0.30, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.01, h * 1.00, w * 0.26, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* ---- layout ---- */
  const pad     = w * 0.06;
  const footerH = h * 0.35; 
  const infoH   = h * 0.15; 
  const headerH = state.brand ? h * 0.07 : h * 0.02;

  const cardX = pad;
  const cardW = w - pad * 2;
  const cardY = pad + headerH;
  const cardBottom = h - pad - footerH - infoH;
  const cardH = Math.max(cardBottom - cardY, h * 0.20);

  /* ---- header / brand ---- */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state.brand) {
    const brandUp = state.brand.toUpperCase();
    const bs = fitFont(brandUp, cardW, w * 0.048, 800);
    ctx.fillStyle = theme;
    ctx.font = `800 ${bs}px ${FONT}`;
    try { ctx.letterSpacing = (w * 0.004) + 'px'; } catch (e) {}
    ctx.fillText(brandUp, w / 2, pad + headerH * 0.52);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  }

  /* ---- product card ---- */
  ctx.save();
  ctx.shadowColor = 'rgba(15,23,42,0.14)';
  ctx.shadowBlur = w * 0.05;
  ctx.shadowOffsetY = w * 0.014;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, cardX, cardY, cardW, cardH, w * 0.035);
  ctx.fill();
  ctx.restore();

  ctx.save();
  roundRect(ctx, cardX, cardY, cardW, cardH, w * 0.035);
  ctx.clip();
  
  const hasImg1 = !!state.productImg;
  const hasImg2 = !!state.productImg2;
  
  if (hasImg1 && hasImg2) {
      // Two images side by side
      const gap = w * 0.02; // Gap between the two images
      const imgW = (cardW - gap) / 2;
      drawContain(state.productImg, cardX, cardY, imgW, cardH, w * 0.02);
      drawContain(state.productImg2, cardX + imgW + gap, cardY, imgW, cardH, w * 0.02);
  } else if (hasImg1) {
      drawContain(state.productImg, cardX, cardY, cardW, cardH, w * 0.045);
  } else if (hasImg2) {
      drawContain(state.productImg2, cardX, cardY, cardW, cardH, w * 0.045);
  } else {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(cardX, cardY, cardW, cardH);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = `600 ${w * 0.030}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🖼  Upload product photos', cardX + cardW / 2, cardY + cardH / 2);
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(15,23,42,0.07)';
  ctx.lineWidth = Math.max(2, w * 0.002);
  roundRect(ctx, cardX, cardY, cardW, cardH, w * 0.035);
  ctx.stroke();

  /* ---- discount badge ---- */
  const discNum = parseFloat(String(state.discount).replace(/[^0-9.]/g, ''));
  if (isFinite(discNum) && discNum > 0) {
    const r  = w * 0.088;
    const cx = cardX + cardW - r * 0.62;
    const cy = cardY + r * 0.62;

    ctx.save();
    ctx.shadowColor = 'rgba(15,23,42,0.30)';
    ctx.shadowBlur = w * 0.025;
    ctx.shadowOffsetY = w * 0.006;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = theme;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = w * 0.009;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${r * 0.62}px ${FONT}`;
    ctx.fillText(Math.round(discNum) + '%', cx, cy - r * 0.20);
    ctx.font = `800 ${r * 0.34}px ${FONT}`;
    ctx.fillText('OFF', cx, cy + r * 0.32);
  }

  /* ---- product name ---- */
  const infoTop = cardY + cardH;

  const nameFont = w * 0.050;
  const priceFont = w * 0.100;
  const mrpFont = w * 0.040;

  ctx.font = `800 ${nameFont}px ${FONT}`;
  const nameLines = wrapText(state.name || 'Product Name', cardW * 0.95, 2);
  const nameLH = nameFont * 1.26;

  const gap = infoH * 0.06;
  const totalBlock = nameLines.length * nameLH + gap + priceFont;
  let ny = infoTop + (infoH - totalBlock) / 2 + nameLH * 0.5;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0f172a';
  ctx.font = `800 ${nameFont}px ${FONT}`;
  for (const line of nameLines) {
    ctx.fillText(line, w / 2, ny);
    ny += nameLH;
  }

  /* ---- price row ---- */
  const priceY = ny - nameLH * 0.5 + gap + priceFont * 0.5;

  const cur = state.currency || '';
  const priceTxt = state.price !== '' ? cur + fmt(state.price) : '';
  const mrpTxt   = state.mrp   !== '' ? cur + fmt(state.mrp)   : '';

  ctx.textBaseline = 'middle';

  if (priceTxt) {
    ctx.font = `900 ${priceFont}px ${FONT}`;
    const pw = ctx.measureText(priceTxt).width;
    ctx.font = `600 ${mrpFont}px ${FONT}`;
    const mw = mrpTxt ? ctx.measureText(mrpTxt).width : 0;
    const g  = mrpTxt ? w * 0.032 : 0;

    let x = (w - (pw + g + mw)) / 2;

    ctx.textAlign = 'left';
    ctx.fillStyle = theme;
    ctx.font = `900 ${priceFont}px ${FONT}`;
    ctx.fillText(priceTxt, x, priceY);
    x += pw + g;

    if (mrpTxt) {
      ctx.fillStyle = '#94a3b8';
      ctx.font = `600 ${mrpFont}px ${FONT}`;
      ctx.fillText(mrpTxt, x, priceY);

      const m = ctx.measureText(mrpTxt);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = Math.max(2, mrpFont * 0.09);
      ctx.beginPath();
      ctx.moveTo(x - 2, priceY + 1);
      ctx.lineTo(x + m.width + 2, priceY + 1);
      ctx.stroke();
    }
  } else if (mrpTxt) {
    ctx.textAlign = 'center';
    ctx.fillStyle = theme;
    ctx.font = `900 ${priceFont}px ${FONT}`;
    ctx.fillText(mrpTxt, w / 2, priceY);
  }

  /* ---- footer ---- */
  const footerTop = h - pad - footerH;

  ctx.strokeStyle = 'rgba(15,23,42,0.12)';
  ctx.lineWidth = Math.max(2, w * 0.002);
  ctx.beginPath();
  ctx.moveTo(pad, footerTop);
  ctx.lineTo(w - pad, footerTop);
  ctx.stroke();

  /* QR block (right) */
  let leftMax = w - pad;

  if (state.qrImg) {
    const qrSize = w * 0.28; 
    const boxPad = qrSize * 0.15;
    const boxSize = qrSize + boxPad * 2;
    
    const qx = w - pad - boxSize;
    const qy = footerTop + (footerH - boxSize) / 2;

    // Draw the white plate (box) with shadow
    ctx.save();
    ctx.shadowColor = 'rgba(15,23,42,0.12)';
    ctx.shadowBlur = w * 0.018;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, qx, qy, boxSize, boxSize, qrSize * 0.15);
    ctx.fill();
    ctx.restore();

    // Draw the border (DECREASED THICKNESS)
    ctx.strokeStyle = theme; 
    ctx.lineWidth = qrSize * 0.05; // Decreased from 0.10 to 0.05
    roundRect(ctx, qx, qy, boxSize, boxSize, qrSize * 0.15);
    ctx.stroke();

    // Draw the QR code inside the box
    ctx.drawImage(state.qrImg, qx + boxPad, qy + boxPad, qrSize, qrSize);

    // Update left boundary so text doesn't overlap
    leftMax = qx - w * 0.05;
  }

  /* contact block (left) */
  const maxTextW = leftMax - pad - w * 0.03;

  if (state.phone || state.website) {
    const f1 = w * 0.034;
    const f2 = w * 0.027;
    const lh1 = f1 * 1.55;
    const lh2 = f2 * 1.65;

    const usedH = (state.phone ? lh1 : 0) + (state.website ? lh2 : 0);
    let cy = footerTop + footerH / 2 - usedH / 2;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    if (state.phone) {
      const s = fitFont(state.phone, maxTextW, f1, 800);
      ctx.font = `800 ${s}px ${FONT}`;
      ctx.fillStyle = '#0f172a';
      ctx.fillText(state.phone, pad, cy);
      cy += lh1;
    }
    if (state.website) {
      const s = fitFont(state.website, maxTextW, f2, 600);
      ctx.font = `600 ${s}px ${FONT}`;
      ctx.fillStyle = '#64748b';
      ctx.fillText(state.website, pad, cy);
    }
  }
}

/* ---------------- form wiring ---------------- */

function autoDiscount() {
  const mrp = parseFloat(state.mrp);
  const price = parseFloat(state.price);
  if (isFinite(mrp) && mrp > 0 && isFinite(price) && price >= 0 && price <= mrp) {
    const d = Math.round((mrp - price) / mrp * 100);
    state.discount = String(d);
    $('f_discount').value = d;
  }
}

['brand', 'name', 'mrp', 'price', 'currency', 'phone', 'website'].forEach(k => {
  $('f_' + k).addEventListener('input', e => {
    state[k] = e.target.value;
    if ((k === 'mrp' || k === 'price') && !state.manualDiscount) autoDiscount();
    render();
  });
});

$('f_discount').addEventListener('input', e => {
  const v = e.target.value;
  state.discount = v;
  state.manualDiscount = v !== '';   // empty → back to auto
  if (!state.manualDiscount) autoDiscount();
  render();
});

$('f_size').addEventListener('change', e => {
  state.size = e.target.value;
  render();
});

$('f_theme').addEventListener('input', e => {
  state.theme = e.target.value;
  document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
  render();
});

document.querySelectorAll('.sw').forEach(sw => {
  sw.addEventListener('click', () => {
    state.theme = sw.dataset.color;
    $('f_theme').value = sw.dataset.color;
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    render();
  });
});

/* ---- image uploads ---- */
function handleImage(file, key, labelId, textId, defaultText) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    state[key] = img;
    const lbl = $(labelId);
    lbl.classList.add('has');
    $(textId).textContent = file.name;
    render();
  };
  img.onerror = () => alert('Could not read that image file.');
  img.src = URL.createObjectURL(file);
}

$('f_photo').addEventListener('change', e =>
  handleImage(e.target.files[0], 'productImg', 'lbl_photo', 'txt_photo', 'Upload product photo 1'));

$('f_photo2').addEventListener('change', e =>
  handleImage(e.target.files[0], 'productImg2', 'lbl_photo2', 'txt_photo2', 'Upload product photo 2 (optional)'));

$('f_qr').addEventListener('change', e =>
  handleImage(e.target.files[0], 'qrImg', 'lbl_qr', 'txt_qr', 'Upload QR code (optional)'));

/* ---- download ---- */
$('btn_download').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `poster-${(state.name || 'product').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30)}-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
});

/* ---- reset ---- */
$('btn_reset').addEventListener('click', () => {
  if (!confirm('Clear all fields and images?')) return;
  location.reload();
});

/* ---- boot ---- */
render();
</script>
</body>
